[package]
name = "bonfire"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "BONFIRE: EMBER token with conditional burns for commissioned community work"
repository = "https://github.com/merajali98-dev/bonfire"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
