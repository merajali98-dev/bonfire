[package]
name = "bonfire"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "BONFIRE: EMBER token with conditional burns for commissioned community work"
repository = "https://github.com/merajali98-dev/bonfire"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

# The sandbox suite (tests/sandbox.rs) needs a native neard binary, which is only published
# for Linux and macOS. On Windows it is skipped; CI runs it on Linux.
[target.'cfg(not(windows))'.dev-dependencies]
near-workspaces = "=0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
