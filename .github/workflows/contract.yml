name: contract

on:
  push:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: The committed report matches the simulator
        run: npm run simulate && git diff --exit-code docs/simulation.md packages/simulator/reports

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: contracts/bonfire
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # npm run verify and the simulator replay run with Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libudev-dev

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.0

      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/bonfire/target
          key: contract-${{ runner.os }}-${{ hashFiles('contracts/bonfire/Cargo.lock') }}
          restore-keys: contract-${{ runner.os }}-

      - name: Install Node dependencies
        working-directory: .
        run: npm ci

      # npm run verify from a fresh checkout, on the committed res/bonfire.wasm. If res/ is
      # stale, the tests still run on a development build of this commit, and the job fails.
      - name: Verify
        working-directory: .
        run: |
          if node scripts/res.ts check; then
            npm run verify 2>&1 | tee sandbox-output.txt
          else
            echo "res/ is stale, so tests ran on a non-reproducible build and the job fails." >> "$GITHUB_STEP_SUMMARY"
            (cd contracts/bonfire && cargo test --lib && cargo near build non-reproducible-wasm --no-abi && cargo test --test sandbox -- --nocapture --test-threads=1) 2>&1 | tee sandbox-output.txt
            exit 1
          fi

      - name: Publish results
        if: always()
        working-directory: .
        run: |
          echo '### Verify' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(HELD|FAILED|UNAVAILABLE) ' sandbox-output.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          echo '### Sandbox measurements' >> "$GITHUB_STEP_SUMMARY"
          grep -o 'METRIC .*' sandbox-output.txt | sed 's/^METRIC /- /' >> "$GITHUB_STEP_SUMMARY" || true

  # Builds the deployable wasm in the pinned image from Cargo.toml and uploads it as the
  # bonfire-wasm artifact. Then checks that res/ is current and rebuilds it from its source commit.
  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh

      - name: Reproducible build of this commit
        working-directory: contracts/bonfire
        run: cargo near build reproducible-wasm

      - name: Describe the build
        run: |
          mkdir -p "$RUNNER_TEMP/bonfire-wasm"
          cp contracts/bonfire/target/near/bonfire.wasm "$RUNNER_TEMP/bonfire-wasm/"
          node scripts/res.ts describe "$RUNNER_TEMP/bonfire-wasm/bonfire.wasm" > "$RUNNER_TEMP/bonfire-wasm/build.json"
          { echo '### Reproducible build'; echo '```json'; cat "$RUNNER_TEMP/bonfire-wasm/build.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bonfire-wasm
          path: ${{ runner.temp }}/bonfire-wasm/

      - name: res/ matches the contract source
        run: node scripts/res.ts check

      - name: Rebuild res/ from its source commit
        run: |
          # This commit's own build names this commit, so it matches res/ only when res/ was built here.
          if node scripts/res.ts compare "$RUNNER_TEMP/bonfire-wasm/bonfire.wasm" 2>/dev/null; then exit 0; fi
          echo "res/ was built from an earlier commit; rebuilding that commit to compare."
          commit=$(node -p "require('./res/build.json').source_commit")
          git worktree add --detach "$RUNNER_TEMP/at-source" "$commit"
          (cd "$RUNNER_TEMP/at-source/contracts/bonfire" && cargo near build reproducible-wasm)
          node scripts/res.ts compare "$RUNNER_TEMP/at-source/contracts/bonfire/target/near/bonfire.wasm"
